name: BedWars
version: 1.0.0
main: me.leon.bedwars.BedWars
depend: [Core]
author: 0CPSLeon

commands:
  bw:
    description: BedWars Hauptbefehl
    aliases: [bedwars]
  join:
    description: Trete einer BedWars Arena bei
    aliases:
      - play
      - enter
      - p
      - e
  setup:
    description: Arena Setup
  stats:
    description: Zeigt deine Stats
  leave:
    description: Verlasse die Arena
    aliases:
      - quit
      - exit
      - lobby
      - l
      - q
      - spawn
      - sp
  hub:
    description: Gehe zurück zur Lobby
    aliases:
      - mainlobby
      - mainhub
      - lobbyhub
      - lobbymain
      - disconnect
      - dc
  start:
    description: Verringert den Countdown
  forcestart:
    description: Erzwinge den Spielstart
  stop:
    description: Stoppe das aktuelle Spiel
  build:
    description: Build-Modus in der Lobby
  bwnpc:
    description: NPC Management
    aliases: [bedwarsnpc]
  private:
    description: Private Runden erstellen und verwalten
    aliases: [privaterunde, pr]
  forcestartprivate:
    description: Force-Start einer privaten Runde
    aliases: [fsp]

permissions:
  bedwars.forcestart:
    default: op
  bedwars.forcestartprivate:
    default: op
  bedwars.setup:
    default: op
  bedwars.stop:
    default: op
  bedwars.build:
    default: op
  bedwars.see-hidden:
    default: op
  bedwars.admin:
    default: op
  bedwars.private:
    default: false