name: BedWars
version: 1.0
main: me.leon.bedwars.BedWars
author: Leon
depend: [Core]

commands:
  bw:
    description: BedWars Hauptbefehl
    usage: /bw <join|leave|maps|achievements|gadgets>
  stats:
    description: Zeige deine Statistiken
  start:
    description: Starte das Spiel (Admin)
  leave:
    description: Verlasse das Spiel
    aliases:
      - leavegame
      - exit
      - quit
      - l
  setup:
    description: Map Setup (Admin)
  shout:
    description: Schreibe an alle
  joinme:
    description: Sende JoinMe Anfrage
  lobby:
    description: Teleportiere zum Lobby Spawn
    aliases:
      - spawn
      - hub
  build:
    description: Aktiviere den Baumodus


permissions:
    bedwars.admin:
        description: Erlaubt den Zugriff auf alle Admin Befehle
        default: op
    bedwars.forcestart:
        description: Erlaubt die Nutzung des Start Befehls
        default: op
    bedwars.lobby.build:
        description: Erlaubt die Nutzung des Baumodus im Lobby Bereich
        default: op